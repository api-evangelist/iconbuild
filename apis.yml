aid: iconbuild
name: Iconbuild
description: 'ICON Technology, Inc. (iconbuild.com) is an Austin, Texas construction
  technologies company using large-scale robotics, advanced materials, and software to
  build homes and structures. ICON develops the Vulcan and Phoenix 3D-printing robots,
  proprietary Lavacrete and CarbonX building materials, and design/build tooling (including
  its CODEX architectural catalog and ICON Prime), and has printed communities across the
  US as well as researched off-world construction with NASA (Project Olympus). Backed by
  Norwest Venture Partners. This is a physical construction / building-technology company;
  as of this pass it publishes no public developer API, SDK, OpenAPI, or /.well-known
  discovery surface, so no API artifacts were harvested.'
